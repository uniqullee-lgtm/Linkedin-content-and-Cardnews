# Google Cloud Build — Cloud Run 자동 배포
# 설정 방법:
#   gcloud builds submit --config=cloudbuild.yaml
#   또는 Cloud Build 트리거로 GitHub 연동
#
# 필요한 Secret Manager 시크릿:
#   - linkedin-app-db-url     : PostgreSQL 연결 문자열
#   - linkedin-app-anthropic  : Anthropic API 키

substitutions:
  _REGION: asia-northeast3          # 서울 리전
  _SERVICE: linkedin-content-maker
  _REPO: linkedin-content-and-cardnews

steps:
  # 1. Docker 이미지 빌드
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$COMMIT_SHA'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest'
      - '.'

  # 2. Artifact Registry에 푸시
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}'

  # 3. Cloud Run 배포
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE}'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$COMMIT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=3000'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=5'
      - '--set-secrets=DATABASE_URL=linkedin-app-db-url:latest,ANTHROPIC_API_KEY=linkedin-app-anthropic:latest'
      - '--add-cloudsql-instances=$PROJECT_ID:${_REGION}:linkedin-db'

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$COMMIT_SHA'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest'

options:
  logging: CLOUD_LOGGING_ONLY
